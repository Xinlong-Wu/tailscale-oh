name: Sync latest upstream release

on:
  # GitHub cron has no persistent "every 72 hours" interval. This runs on
  # every third UTC day-of-month, away from the top-of-hour scheduling surge.
  schedule:
    - cron: "23 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: automated-upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Xinlong-Wu/tailscale-oh'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare latest signed upstream release
        id: prepare
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_REPOSITORY: tailscale/tailscale
          DOWNSTREAM_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
          SYNC_REPORT_FILE: ${{ runner.temp }}/upstream-sync-report.md
          SYNC_ISSUE_TITLE_FILE: ${{ runner.temp }}/upstream-sync-issue-title.txt
        run: bash scripts/prepare-upstream-release-sync.sh

      - name: Create or update blocking issue
        if: steps.prepare.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/upstream-sync-report.md
          TITLE_FILE: ${{ runner.temp }}/upstream-sync-issue-title.txt
        run: |
          set -euo pipefail

          if [[ ! -s "$REPORT_FILE" || ! -s "$TITLE_FILE" ]]; then
            printf '%s\n' 'Automated upstream sync failed unexpectedly' > "$TITLE_FILE"
            {
              echo 'The preparation script failed before it could produce a detailed report.'
              echo
              echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > "$REPORT_FILE"
          fi

          issue_title="$(<"$TITLE_FILE")"
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${issue_title}\") | .number" | sed -n '1p')"

          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$REPORT_FILE"
            echo "Updated blocking issue #${existing_issue}" >> "$GITHUB_STEP_SUMMARY"
          else
            issue_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$issue_title" \
              --body-file "$REPORT_FILE")"
            echo "Created blocking issue: ${issue_url}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop after a blocked preparation
        if: steps.prepare.outcome == 'failure'
        run: exit 1

      - name: Push synchronization branch
        if: steps.prepare.outputs.action == 'prepared'
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SYNC_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          git push \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Open pull request to main
        id: pull-request
        if: steps.prepare.outputs.action == 'prepared'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SYNC_BRANCH: ${{ steps.prepare.outputs.branch }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_URL: ${{ steps.prepare.outputs.release_url }}
          UPSTREAM_COMMIT: ${{ steps.prepare.outputs.upstream_commit }}
          RELEASE_FINGERPRINT: ${{ steps.prepare.outputs.release_fingerprint }}
          TOOLCHAIN_CHANGED: ${{ steps.prepare.outputs.toolchain_changed }}
          BASE_GO_VERSION: ${{ steps.prepare.outputs.base_go_version }}
          RELEASE_GO_VERSION: ${{ steps.prepare.outputs.release_go_version }}
          BASE_TOOLCHAIN_VERSION: ${{ steps.prepare.outputs.base_toolchain_version }}
          RELEASE_TOOLCHAIN_VERSION: ${{ steps.prepare.outputs.release_toolchain_version }}
          BASE_TOOLCHAIN_REV: ${{ steps.prepare.outputs.base_toolchain_rev }}
          RELEASE_TOOLCHAIN_REV: ${{ steps.prepare.outputs.release_toolchain_rev }}
        run: |
          set -euo pipefail

          pr_body="${RUNNER_TEMP}/upstream-sync-pr.md"
          # shellcheck disable=SC2016 # Backticks and checklist text are intentional Markdown.
          {
            echo "Automated synchronization of the latest formal upstream release: [${RELEASE_TAG}](${RELEASE_URL})."
            echo
            echo 'The signed upstream tag was merged into this branch, preserving both histories.'
            echo
            echo 'Release provenance:'
            echo
            printf -- '- Upstream commit: `%s`\n' "$UPSTREAM_COMMIT"
            printf -- '- Signing-key fingerprint: `%s`\n' "$RELEASE_FINGERPRINT"
            echo
            if [[ "$TOOLCHAIN_CHANGED" == true ]]; then
              echo '> [!WARNING]'
              echo '> The upstream Go/toolchain metadata changed. The PR was intentionally created so CI can report compatibility; do not merge until a compatible Xinlong-Wu/go-ohos toolchain has been reviewed and the OpenHarmony job passes.'
              echo
              echo '| Metadata | Current main | Upstream release |'
              echo '| --- | --- | --- |'
              printf '| `go` directive | `%s` | `%s` |\n' "$BASE_GO_VERSION" "$RELEASE_GO_VERSION"
              printf '| `go.toolchain.version` | `%s` | `%s` |\n' "$BASE_TOOLCHAIN_VERSION" "$RELEASE_TOOLCHAIN_VERSION"
              printf '| `go.toolchain.rev` | `%s` | `%s` |\n' "$BASE_TOOLCHAIN_REV" "$RELEASE_TOOLCHAIN_REV"
              echo
            fi
            echo 'Manual review checklist:'
            echo
            echo '- [ ] Resolve any fork-specific import, workflow, and OpenHarmony compatibility changes.'
            echo '- [ ] Confirm the complete PR CI, including the go-ohos + DockerHarmony job, passes.'
            echo '- [ ] Merge manually only after review.'
            echo
            echo 'Auto-merge is intentionally not enabled. No tag or GitHub Release is created before the PR reaches `main`.'
          } > "$pr_body"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "sync: upstream ${RELEASE_TAG}" \
            --body-file "$pr_body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created pull request: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
